<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>旧信箱里的拾信者</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
  <link rel="icon" href="icons/icon-72x72.png" sizes="72x72" type="image/png" />
  <link rel="icon" href="icons/icon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="icons/icon-128x128.png" sizes="128x128" type="image/png" />
  <link rel="icon" href="icons/icon-144x144.png" sizes="144x144" type="image/png" />
  <link rel="icon" href="icons/icon-152x152.png" sizes="152x152" type="image/png" />
  <link rel="icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png" />
  <link rel="icon" href="icons/icon-384x384.png" sizes="384x384" type="image/png" />
  <link rel="icon" href="icons/icon-512x512.png" sizes="512x512" type="image/png" />
  <!-- ios support -->
  <link rel="apple-touch-icon" href="icons/icon-72x72.png" sizes="72x72" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-128x128.png" sizes="128x128" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-144x144.png" sizes="144x144" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-152x152.png" sizes="152x152" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-384x384.png" sizes="384x384" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-512x512.png" sizes="512x512" type="image/png" />

  <meta name="theme-color" content="#000" />

  <style>
    html {
      background: #1b1620;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body, html {
      overscroll-behavior: none;
    }

    #canvas, #overlayDiv {
      position: absolute;
      top: 0px;
      left: 0px;

      width: 100%;
      height: 100%;

      border: 0 none;
    }

    #canvas {
      background: #000;
    }

    .visible {
      visibility: visible;
      opacity: 1.0;
      transition: opacity .1s linear;
    }

    .hidden {
      visibility: hidden;
      opacity: 0;
      transition: visibility 0s .25s, opacity .25s linear;
    }

    #statusDiv, #inputDiv {
      background: rgba(18, 14, 22, 0.82);
      width: 46%;
      margin: auto;
      min-width: 300px;
      padding: 12px 16px;

      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      border-radius: 0 0 8px 8px;
      backdrop-filter: blur(6px);
    }

    #statusTextDiv {
      overflow: auto;
      max-height: 40vh;
      color: #b8aea4;
      font-size: 13px;
      letter-spacing: .04em;
    }

    #statusProgress {
      display: none;
      width: 100%;
      height: 3px;
      border: 0 none;
      border-radius: 2px;
      background: rgba(255, 255, 255, .12);
      accent-color: #e6b98a;
    }

    #statusProgress::-webkit-progress-bar {
      background: rgba(255, 255, 255, .12);
      border-radius: 2px;
    }

    #statusProgress::-webkit-progress-value {
      background: linear-gradient(90deg, #c9a07a, #e6b98a);
      border-radius: 2px;
    }

    #statusProgress::-moz-progress-bar {
      background: #e6b98a;
      border-radius: 2px;
    }

    #inputDiv {
      width: 65%;
      padding-left: 10px;
      padding-right: 20px;
    }

    #loadHint {
      display: none;
      margin-top: 10px;
      color: #e6b98a;
      font-size: 13px;
      line-height: 1.7;
    }

    #loadHint a {
      color: #f7e3c8;
      text-decoration: underline;
      cursor: pointer;
    }

    /* 手机竖屏提示：建议横屏 + 全屏按钮 */
    #rotateHint {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 14px;
      background: rgba(9, 13, 19, 0.92);
      border-top: 1px solid rgba(230, 185, 138, 0.35);
      color: #e6c9a8;
      font-size: 13px;
      text-align: center;
      align-items: center;
      justify-content: center;
      z-index: 99998;
    }

    #rotateHint button {
      margin-left: 10px;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid rgba(230, 185, 138, 0.55);
      background: transparent;
      color: #f2d6b0;
      font-size: 13px;
    }

    @media (orientation: portrait) and (max-width: 900px) {
      #rotateHint {
        display: flex;
      }
    }

    /* 诊断浮层：黑屏时能点开看原因 */
    #diagBtn {
      display: none;
      position: fixed;
      right: 10px;
      bottom: 56px;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(230, 185, 138, 0.6);
      background: rgba(9, 13, 19, 0.9);
      color: #f2d6b0;
      font-size: 12px;
      z-index: 100000;
    }

    #diag {
      display: none;
      position: fixed;
      left: 8px;
      right: 8px;
      bottom: 96px;
      max-height: 46vh;
      overflow: auto;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(230, 185, 138, 0.45);
      background: rgba(6, 9, 14, 0.96);
      color: #e8d7bf;
      font-size: 12px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      z-index: 100001;
    }

    #inputPrompt {
      color: #eee;
      font-size: 150%;
      margin-bottom: 1em;
      margin-top: 1em;

    }

    #inputText {
      width: 100%;
      font-size: 175%;
      padding: 5px;
      background: inherit;
      color: #eee;
    }

    #inputText:focus {
      color: #ffffff;
    }

    #ContextContainer {
      position: absolute;
      left: 0px;
      top: 0px;
      color: white;
    }

    #ContextContainer.shown {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0px 0px 5px 0px;
    }

    #ContextButton {
      text-decoration: none;
      color: lightgrey;
      font-size: xx-large;
      cursor: pointer;
      user-select: none;
      -moz-user-select: none;
      padding: 10px 10px;
      opacity: .75;
    }

    #ContextButton:focus {
      outline: none;
      color: #ffffff;
      opacity: 1.0;
    }

    #ContextMenu a {
      text-decoration: none;
      color: lightgrey;
      background: #444;
      height: 48px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid lightgrey;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 5px 5px;
      opacity: 1.0;
    }

    #ContextMenu a:hover {
      text-decoration: none;
      background: #666666;
      color: #ffffff
    }

    #presplash {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
        margin: auto;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
    }

  </style>

</head>

<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
  <div id="overlayDiv"></div>

  <img id="presplash" src="web-presplash.jpg">

  <div id="ContextContainer">
    <a id="ContextButton">&#8801;</a><br />
    <div id="ContextMenu" style="display: none;">
      <input id="ID_SavegamesImport" type="file" onchange="onSavegamesImport(this)" accept="application/zip"
        style=display:none></input>
      <a href="javascript:document.getElementById('ID_SavegamesImport').click();">Import Saves</a>
      <a href="javascript:onSavegamesExport();">Export Saves</a>
      <a href="javascript:FSDownload('/log.txt', 'text/plain');">Download Log</a>
      <a href="https://www.renpy.org/" target="_blank">
          Powered by Ren'Py
      </a>
      </span>
    </div>
  </div>

  <div id="statusDiv" class="hidden">
    <div id="statusTextDiv"></div>
    <progress id="statusProgress" value="0" max="100"></progress>
    <div id="loadHint"></div>
  </div>


  <div id="inputDiv" class="hidden">
    <form id="inputForm">
      <div id="inputPrompt"></div>
      <input id="inputText" type="text">
    </form>
  </div>

  <div id="rotateHint">
    <span>建议横屏游玩，画面更大</span>
    <button onclick="omlFullscreen()">全屏</button>
  </div>

  <script>
      function omlFullscreen() {
          var el = document.documentElement;
          if (el.requestFullscreen) {
              el.requestFullscreen();
          } else if (el.webkitRequestFullscreen) {
              el.webkitRequestFullscreen();
          }
      }

      // 兜底：部分手机浏览器 / 内置 webview 没有 Web Audio，
      // 引擎初始化会直接抛错退出，表现为「进度条满了却一直黑屏」。
      // 这里补一个空壳，让引擎能起来（代价是没有声音）。
      (function () {
          if (window.AudioContext || window.webkitAudioContext) return;
          function noop() { }
          function Node() {
              this.gain = { value: 1, setValueAtTime: noop, linearRampToValueAtTime: noop, cancelScheduledValues: noop };
              this.frequency = { value: 440, setValueAtTime: noop };
              this.playbackRate = { value: 1 };
              this.buffer = null;
              this.onended = null;
          }
          ["connect", "disconnect", "start", "stop", "suspend", "resume", "close",
              "createGain", "createBufferSource", "createOscillator", "createAnalyser",
              "createDynamicsCompressor", "createBuffer", "decodeAudioData", "destroy"
          ].forEach(function (k) {
              Node.prototype[k] = function () { return new Node(); };
          });
          function Stub() {
              this.destination = new Node();
              this.currentTime = 0;
              this.sampleRate = 44100;
              this.state = "suspended";
              this.listener = new Node();
          }
          Stub.prototype = Object.create(Node.prototype);
          window.AudioContext = window.webkitAudioContext = Stub;
      })();

      // The URL to game.zip, relative to the URL of this file.
      window.gameZipURL = 'game.zip';

      // Register the service worker.
      if (navigator.serviceWorker) {
          if (!navigator.serviceWorker.controller) {
              navigator.serviceWorker.register('./service-worker.js', { updateViaCache: 'all' });
          }
      }

      // 加载看门狗：
      //   1) 进度 25 秒没动 → 网络断了
      //   2) 进度已经到 100% 但 40 秒还没进游戏 → 引擎起不来（内存不足/浏览器不支持/在微信里打开）
      (function () {
          var errs = [];
          window.addEventListener('error', function (e) {
              errs.push(String((e && e.message) || e));
          });

          var lastValue = -1;
          var lastChange = Date.now();
          var fullSince = 0;
          var hint = document.getElementById('loadHint');
          var statusDiv = document.getElementById('statusDiv');

          function webgl2() {
              try {
                  var c = document.createElement('canvas');
                  return !!(c.getContext && c.getContext('webgl2'));
              } catch (e) {
                  return false;
              }
          }

          setInterval(function () {
              var loading = statusDiv && statusDiv.className.indexOf('hidden') === -1;
              var bar = document.getElementById('statusProgress');
              var v = bar ? parseFloat(bar.value || 0) : 0;

              if (v !== lastValue) {
                  lastValue = v;
                  lastChange = Date.now();
              }

              if (!loading) {
                  if (hint) hint.style.display = 'none';
                  return;
              }

              if (v >= 99.5) {
                  if (!fullSince) fullSince = Date.now();
              } else {
                  fullSince = 0;
              }

              // 下载完了却进不去
              if (fullSince && (Date.now() - fullSince) / 1000 > 40 && hint && !hint.innerHTML) {
                  hint.innerHTML =
                      '<b>素材已经下载完，但游戏引擎没启动起来。</b><br>' +
                      '常见原因：① 在微信/QQ 里点的链接 → 请点右上角「在浏览器打开」；' +
                      '② 手机内存不足 → 关掉其他 App 再刷新；' +
                      '③ 系统太旧，不支持 WebGL2（本机检测：' + (webgl2() ? '支持' : '<b>不支持</b>') + '）。<br>' +
                      '诊断信息：' + (navigator.userAgent || '').slice(0, 120) +
                      (errs.length ? '<br>报错：' + errs.slice(0, 2).join(' / ').slice(0, 160) : '') +
                      '<br><a onclick="location.reload()">点这里重新加载</a>';
                  hint.style.display = 'block';
                  return;
              }

              if ((Date.now() - lastChange) / 1000 > 25 && hint && !hint.innerHTML) {
                  hint.innerHTML = '网络似乎卡住了。首次进入要下载约 50MB（引擎 + 素材），建议先连 WiFi；' +
                      '也可以 <a onclick="location.reload()">点这里重试</a>。';
                  hint.style.display = 'block';
              }
          }, 1000);
      })();

      // 先装错误收集（不等 DOM），再挂面板
      (function () {
          window.__omlErrs = window.__omlErrs || [];
          function push(m) {
              if (!m) return;
              var a = window.__omlErrs;
              a.push(String(m).slice(0, 300));
              if (a.length > 12) a.shift();
          }
          window.__omlAddErr = push;
          window.addEventListener('error', function (e) {
              push((e && e.message) || e);
          });
          window.addEventListener('unhandledrejection', function (e) {
              push(e && e.reason);
          });
          var _ce = console.error.bind(console);
          console.error = function () {
              try {
                  push(Array.prototype.join.call(arguments, ' '));
              } catch (e) { }
              _ce.apply(null, arguments);
          };
      })();

      function omlInitDiag() {
          var errs = window.__omlErrs;
          var diag = document.getElementById('diag');
          var btn = document.getElementById('diagBtn');
          if (!diag || !btn) return;

          function webgl2() {
              try {
                  return !!document.createElement('canvas').getContext('webgl2');
              } catch (e) {
                  return false;
              }
          }

          function text() {
              var bar = document.getElementById('statusProgress');
              var st = document.getElementById('statusTextDiv');
              return '状态：' + (st ? st.textContent : '-') +
                  ' | 进度：' + (bar ? bar.value : '-') +
                  '\nWebGL2：' + (webgl2() ? '支持' : '不支持') +
                  '\nAudioContext：' + ((window.AudioContext || window.webkitAudioContext) ? '有' : '没有') +
                  '\nUA：' + navigator.userAgent +
                  '\n报错（' + errs.length + '）：' + (errs.length ? '\n- ' + errs.join('\n- ') : ' 无');
          }

          btn.addEventListener('click', function () {
              if (diag.style.display === 'block') {
                  diag.style.display = 'none';
                  return;
              }
              diag.textContent = text();
              diag.style.display = 'block';
          });

          setTimeout(function () { btn.style.display = 'block'; }, 18000);

          setInterval(function () {
              if (errs.length && diag.style.display !== 'block') {
                  diag.textContent = text();
                  diag.style.display = 'block';
              }
          }, 2000);
      }

      if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', omlInitDiag);
      } else {
          omlInitDiag();
      }
  </script>
  <button id="diagBtn">诊断</button>
  <div id="diag"></div>

  <script src="renpy-pre.js"></script>
  <script async type="text/javascript" src="renpy.js"></script>
</body>

</html>
